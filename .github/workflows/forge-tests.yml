name: SkellForge CLI tests
on:
  push:
    branches: [main, 'release/**', 'releases/**', 'production/**']
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Cancel only superseded development runs. Main, manual, production, release
# and tag builds have isolated run groups and are never auto-canceled.
concurrency:
  # A shared group is used only for one PR's superseded runs. Every other
  # event has a unique run ID so queued main/release/manual/tag jobs are never
  # replaced by a newer pending run.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test generator, IDs and VST3 packaging
        run: python -m unittest discover -s tests -v
      - name: Check CLI environment report
        run: python -m skellforge doctor
      - name: Generate and validate sample plugin
        run: |
          python -m skellforge new "Skell Forge Smoke" generated-smoke --code SF90
          python -m skellforge validate generated-smoke
      - name: Audit generated sample
        run: python -m skellforge audit generated-smoke
      - name: Build installable Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel and verify generation outside checkout
        run: |
          python -c "import pathlib,subprocess,sys,tempfile; w=next(pathlib.Path('dist').glob('skellforge-*.whl')); subprocess.check_call([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',str(w)]); d=pathlib.Path(tempfile.mkdtemp()); p=d/'wheel-smoke'; subprocess.check_call([sys.executable,'-m','skellforge','new','Skell Wheel Smoke',str(p),'--code','SW90'],cwd=d); subprocess.check_call([sys.executable,'-m','skellforge','validate',str(p)],cwd=d); subprocess.check_call([sys.executable,'-m','skellforge','audit',str(p)],cwd=d)"
