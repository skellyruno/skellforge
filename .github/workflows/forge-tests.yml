name: SkellForge CLI tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Give manual, main, production, release and tag runs unique concurrency
# groups so a later feature push can never cancel or replace them.
# Deduplicate only superseded feature/fix branches and pull requests.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'production' || github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/production/')) && github.run_id || (github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name != 'main' && github.ref_name != 'production' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/production/')) }}
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test generator, IDs and VST3 packaging
        run: python -m unittest discover -s tests -v
      - name: Check Python package compilation
        run: python -m compileall -q skellforge tests tools
      - name: Configure independent SkellNative DSP (no JUCE)
        run: cmake -S native -B native-build -DSKELLNATIVE_BUILD_TESTS=ON
      - name: Compile independent SkellNative DSP
        run: cmake --build native-build --config Release --parallel 2
      - name: Test JUCE-free DSP at multiple audio rates
        run: ctest --test-dir native-build -C Release --output-on-failure
      - name: Import desktop Studio module on Windows
        if: runner.os == 'Windows'
        run: python -c "import skellforge.studio_app; print('Desktop module imports')"
      - name: Check CLI environment report
        run: python -m skellforge doctor
      - name: Generate and validate sample plugin
        run: |
          python -m skellforge new "Skell Forge Smoke" generated-smoke --code SF90
          python -m skellforge validate generated-smoke
