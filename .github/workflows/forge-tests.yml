name: SkellForge CLI tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Cancel only superseded development runs. Main, manual, production, release
# and tag builds have isolated run groups and are never auto-canceled.
concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'production' || github.ref_name == 'release' || github.ref_type == 'tag' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/releases/') || startsWith(github.ref, 'refs/heads/production/') || startsWith(github.base_ref, 'release/')) && github.run_id || (github.head_ref || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref_name != 'main' && github.ref_name != 'production' && github.ref_name != 'release' && github.ref_type != 'tag' && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/releases/') && !startsWith(github.ref, 'refs/heads/production/') && !startsWith(github.head_ref, 'release/') && !startsWith(github.head_ref, 'releases/') && !startsWith(github.head_ref, 'production/') && !startsWith(github.base_ref, 'release/') && !startsWith(github.base_ref, 'releases/') && !startsWith(github.base_ref, 'production/') }}
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test generator, IDs and VST3 packaging
        run: python -m unittest discover -s tests -v
      - name: Check CLI environment report
        run: python -m skellforge doctor
      - name: Generate and validate sample plugin
        run: |
          python -m skellforge new "Skell Forge Smoke" generated-smoke --code SF90
          python -m skellforge validate generated-smoke
      - name: Audit generated sample
        run: python -m skellforge audit generated-smoke
