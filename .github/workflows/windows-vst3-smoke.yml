name: SkellForge generated Windows VST3 smoke build
on:
  workflow_dispatch:
  push:
    # Cover branch commits even when GitHub doesn't deliver a PR synchronize run.
    # Path filters avoid expensive Windows builds for DSP-only experiments.
    branches: [main, "feature/**", "fix/**", "agent/**"]
    paths:
      - "skellforge/**"
      - "templates/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/windows-vst3-smoke.yml"
  pull_request:
    paths:
      - "skellforge/**"
      - "templates/**"
      - "tools/**"
      - "examples/**"
      - ".github/workflows/windows-vst3-smoke.yml"
permissions:
  contents: read
concurrency:
  group: skellforge-smoke-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate Windows VST3 from SkellLang source
        run: |
          python -m skellforge lang-check examples/SkellWarmth.skell
          python -m skellforge lang-new examples/SkellWarmth.skell "Skell Forge Smoke" generated-smoke --code SF90
          python -m skellforge validate generated-smoke
          python -m skellforge regenerate generated-smoke
      - name: Build JUCE and pinned SkellCore VST3
        run: cmake -S generated-smoke -B generated-smoke/build -A x64 -DSKELLFORGE_BUILD_DSP_TESTS=ON
      - name: Compile Release plugin
        run: cmake --build generated-smoke/build --config Release --parallel 2
      - name: Run actual generated C++ DSP multirate/impulse regression tests
        run: ctest --test-dir generated-smoke/build -C Release --output-on-failure
      - name: Verify exact output and bundle it
        run: python -m skellforge package generated-smoke
      - name: Build and validate screenshots from the real JUCE editor
        run: python -m skellforge preview generated-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: SkellForge-Smoke-Real-JUCE-UI
          path: generated-smoke/.skellforge/ui-preview/**/*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: SkellForge-Smoke-Windows-VST3
          path: generated-smoke/SkellForge-SkellForgeSmoke-Windows-VST3.zip
          if-no-files-found: error
          retention-days: 7
